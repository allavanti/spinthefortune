<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1636">
<meta name="robots" content="noindex">
<title>Host - Spin the Fortune</title>
<link rel="stylesheet" href="/css/board.css">
<style>
body.ctl{
  height:auto;min-height:100%;background:#0b1636;color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:max(18px,env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;
}
.top{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  position:sticky;top:0;z-index:5;background:#0b1636;border-bottom:1px solid #1c2c66;
}
.dot{width:10px;height:10px;border-radius:50%;background:#c9463d;flex:none}
.dot.on{background:#2fb36a}
#status{flex:1;min-width:0;font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{
  background:none;border:2px solid #2a3d7c;color:#fff;border-radius:8px;
  min-width:38px;height:38px;font-size:18px;flex:none;padding:0 8px;
}
.lang{font-size:13px;font-weight:700}
.room{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px 14px;background:#0f1d4c;border-bottom:1px solid #1c2c66;
}
.room .code{font:800 26px/1 ui-monospace,Consolas,monospace;letter-spacing:.16em;color:#ffd84a}
.room .lbl{font-size:12px;opacity:.7;display:block;margin-bottom:3px}
.room .hint{flex:1 1 220px;font-size:13px;opacity:.8;line-height:1.35}
.pv{height:32vh;min-height:150px;display:flex;align-items:center;justify-content:center;padding:8px 12px}
.meta{
  display:flex;justify-content:space-between;gap:10px;padding:2px 14px 6px;
  font-size:14px;color:#ffd84a;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
}
.meta .n{color:#fff;opacity:.6;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 12px}
.chip{
  border:2px solid #2a3d7c;border-radius:999px;padding:8px 14px;
  font-weight:700;background:#0f1d4c;color:#fff;font-size:15px;
}
.chip.on{background:#f5c542;color:#241a00;border-color:#f5c542}
#keys{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:8px 12px}
.key{
  height:48px;border:2px solid #2a3d7c;border-radius:10px;background:#13245e;
  color:#fff;font-weight:700;font-size:19px;
}
.key.vowel{border-color:#8a7a2a;color:#f5c542}
.key.hit{background:#2fb36a;border-color:#2fb36a;color:#fff}
.key.miss{background:#c9463d;border-color:#c9463d;color:#fff;opacity:.75}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 12px}
.btn{
  border:2px solid #2a3d7c;background:#0f1d4c;color:#fff;border-radius:10px;
  padding:12px 6px;font-size:15px;font-weight:600;
}
.btn.primary{background:#f5c542;color:#241a00;border-color:#f5c542}
.btn.small{padding:8px 12px;font-size:13px}
#toast{
  position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:9;
  background:rgba(0,0,0,.85);border:1px solid #f5c542;color:#fff;
  padding:8px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;
  transition:opacity .2s;max-width:92vw;text-align:center;
}
#toast.on{opacity:1}
dialog{
  width:min(560px,94vw);max-height:92vh;overflow:auto;border:2px solid #f5c542;border-radius:14px;
  background:#0b1636;color:#fff;padding:16px;
}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{margin:0 0 6px;font-size:18px;color:#f5c542}
dialog label{display:block;margin:12px 0 4px;font-size:13px;opacity:.85}
dialog input[type=number]{width:8em;background:#050c24;color:#fff;border:2px solid #2a3d7c;border-radius:8px;padding:8px;font:14px ui-monospace,Consolas,monospace}
dialog .chk{display:flex;gap:10px;align-items:center;opacity:1;margin-top:14px;font-size:14px}
dialog .chk input{width:20px;height:20px}
dialog textarea{
  width:100%;background:#050c24;color:#fff;border:2px solid #2a3d7c;border-radius:8px;
  padding:10px;font:14px/1.5 ui-monospace,Consolas,monospace;
}
dialog textarea{height:24vh;resize:vertical}
#ptxt{height:12vh}
#gWheel{height:16vh}
.gamehint{padding:6px 14px;font-size:15px;font-weight:700;color:#ffd84a;min-height:1.6em}
.gamehint[hidden]{display:none}
.chip small{opacity:.75;font-weight:600;margin-left:4px}
.actions.game{grid-template-columns:2fr 1fr 1fr}
.actions[hidden]{display:none}
.btn:disabled,.key:disabled{opacity:.4}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.row .grp{display:flex;gap:8px;margin-left:auto}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #ffd84a;outline-offset:2px}
</style>
</head>
<body class="ctl">

<div class="top">
  <span class="dot" id="dot"></span>
  <span id="status" role="status">&hellip;</span>
  <a class="icon lang" id="bHelp" href="/#how" data-i18n="help" style="display:flex;align-items:center;text-decoration:none;color:#fff">How it works</a>
  <button class="icon lang" id="bLang" type="button">IT</button>
  <button class="icon" id="bSet" type="button" data-i18n-aria="settings" aria-label="Settings">&#9881;</button>
</div>

<div class="room">
  <div>
    <span class="lbl" data-i18n="screen_code">Screen code</span>
    <span class="code" id="roomCode">------</span>
  </div>
  <div class="hint" id="roomHint"></div>
  <button class="btn small" id="bCopy" type="button" data-i18n="copy_link">Copy screen link</button>
</div>

<div class="pv" id="pv"><div class="board clear" id="board"></div></div>
<div class="meta"><span id="catTxt"></span><span class="n" id="counter"></span></div>
<div class="chips" id="chips"></div>
<div class="gamehint" id="hint" role="status" hidden></div>
<div class="actions game" id="gameBtns" hidden>
  <button class="btn primary" id="bSpin" type="button" data-i18n="spin">Spin</button>
  <button class="btn" id="bSolved" type="button" data-i18n="solved_btn">Solved</button>
  <button class="btn" id="bWrong" type="button" data-i18n="wrong_btn">Wrong</button>
</div>
<div id="keys"></div>

<div class="actions">
  <button class="btn" id="bPrev" type="button">&#9664; <span data-i18n="prev">Prev.</span></button>
  <button class="btn" id="bRand" type="button" data-i18n="rand">Random</button>
  <button class="btn" id="bNext" type="button"><span data-i18n="next">Next</span> &#9654;</button>
  <button class="btn primary" id="bReveal" type="button" data-i18n="reveal">Reveal all</button>
  <button class="btn" id="bReset" type="button" data-i18n="reset">Reset phrase</button>
  <button class="btn" id="bTurn" type="button"><span data-i18n="turn">Next turn</span> &#9654;</button>
</div>

<div id="toast" role="status"></div>

<dialog id="dlg">
  <h2 data-i18n="settings_title">Settings</h2>
  <label for="txt" data-i18n="phrases_label">Phrases</label>
  <textarea id="txt" spellcheck="false"></textarea>
  <label for="ptxt" data-i18n="players_label">Players</label>
  <textarea id="ptxt" spellcheck="false" data-i18n-ph="players_ph"></textarea>
  <label class="chk"><input type="checkbox" id="gOn"><span data-i18n="scoring_label">Use scores and the wheel</span></label>
  <label for="gVowel" data-i18n="vowel_cost_label">Vowel cost</label>
  <input type="number" id="gVowel" min="0" max="9999" step="50">
  <label for="gWheel" data-i18n="wheel_label">Wheel segments</label>
  <textarea id="gWheel" spellcheck="false"></textarea>
  <div class="row"><button class="btn small" id="dScores" type="button" data-i18n="reset_scores">Reset all scores</button></div>
  <div class="row">
    <button class="btn small" id="dNew" type="button" data-i18n="new_room">New room and code</button>
    <div class="grp">
      <button class="btn" id="dCancel" type="button" data-i18n="cancel">Cancel</button>
      <button class="btn primary" id="dSave" type="button" data-i18n="save">Save</button>
    </div>
  </div>
</dialog>

<script src="/js/board.js"></script>
<script src="/js/rules.js"></script>
<script src="/js/i18n.js"></script>
<script>
(function(){
'use strict';

var R=window.RuotaBoard, RU=window.Rules, I=window.I18N, t=I.t;
document.title=t('play_title');
I.apply();

var K={frasi:'stf-phrases-v1',conc:'stf-players-v1',partita:'stf-game-v1',room:'stf-room-v1',game:'stf-scoring-v1'};
var SPIN_MS=6500;   // la ruota sulla TV gira circa 5,5 secondi

function el(id){return document.getElementById(id);}
var board=el('board'),pv=el('pv'),dlg=el('dlg'),toastEl=el('toast');
var toastTimer=null;

/* stato di gioco: vive qui, lo schermo riceve dal server solo la copia mascherata */
var G={phrases:[],idx:0,called:[],revealed:{},players:[],turn:0,ev:{seq:0,t:''},game:null};

/* ---------- memoria del browser ---------- */
function get(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}}
function set(k,v){try{localStorage.setItem(k,v);}catch(e){}}

function parsePlayers(text){
  return text.split(/\r?\n/).map(function(s){return s.trim();}).filter(function(s){return s;}).slice(0,12);
}
function cur(){return G.phrases[G.idx]||null;}
function calledAs(L){
  for(var n=0;n<G.called.length;n++){if(G.called[n].l===L)return G.called[n].r;}
  return '';
}

function savePartita(){
  var p=cur();
  set(K.partita,JSON.stringify({
    idx:G.idx,text:p?p.text:'',called:G.called,revealed:G.revealed,turn:G.turn,seq:G.ev.seq,game:G.game
  }));
}
function loadPartita(){
  try{
    var s=JSON.parse(get(K.partita)||'null');
    if(!s)return;
    var p=G.phrases[s.idx];
    if(!p||p.text!==s.text)return;
    G.idx=s.idx;
    G.called=s.called||[];
    G.revealed=s.revealed||{};
    G.turn=s.turn||0;
    G.ev={seq:s.seq||0,t:''};
    if(G.turn>=G.players.length)G.turn=0;
    if(s.game&&G.game&&Array.isArray(s.game.scores)){
      G.game.scores=s.game.scores.slice(0,G.players.length).map(function(x){return {r:+x.r||0,t:+x.t||0};});
      RU.fitPlayers(G,G.players.length);
      if(['spin','letter','choose'].indexOf(s.game.phase)>=0)G.game.phase=s.game.phase;
      G.game.val=+s.game.val||0;
      if(s.game.spin&&typeof s.game.spin.seq==='number')G.game.spin=s.game.spin;
    }
  }catch(e){}
}

/* ---------- punteggi e ruota: impostazioni ---------- */
function gameSettings(){
  var s=null;
  try{s=JSON.parse(get(K.game)||'null');}catch(e){}
  s=s||{};
  var w=RU.parseWheel(s.wheelText);
  return {on:s.on!==false,vowel:typeof s.vowel==='number'?s.vowel:250,wheel:w||RU.DEFAULT_WHEEL.slice()};
}
function applyGameSettings(keep){
  var gs=gameSettings(),old=G.game;
  if(!gs.on||!G.players.length){G.game=null;return;}
  G.game=RU.newGame(G.players.length,{vowel:gs.vowel,wheel:gs.wheel});
  if(old&&keep){G.game.scores=old.scores;G.game.phase=old.phase;G.game.val=old.val;G.game.spin=old.spin;}
  RU.fitPlayers(G,G.players.length);
}

/* ---------- stanza (codice per lo schermo) ---------- */
var room=null;
try{room=JSON.parse(get(K.room)||'null');}catch(e){room=null;}
if(!room||typeof room.token!=='string'||typeof room.code!=='string')room=null;

function screenUrl(){return location.origin+'/screen?c='+(room?room.code:'');}
function drawRoom(){
  el('roomCode').textContent=room?room.code:'------';
  el('roomHint').textContent=t('open_screen',{url:location.host+'/screen'});
}
function createRoom(){
  return fetch('/api/room',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({lang:I.lang})
  })
    .then(function(r){
      if(r.status===429)throw new Error('limit');
      if(!r.ok)throw new Error('http '+r.status);
      return r.json();
    })
    .then(function(d){
      room={token:d.token,code:d.code};
      set(K.room,JSON.stringify(room));
      drawRoom();
    });
}

/* ---------- invio allo schermo ---------- */
function buildState(){
  var p=cur()||{cat:'',text:''};
  return {
    v:1,phrase:p.text,cat:p.cat,
    revealed:Object.keys(G.revealed).map(Number),
    called:G.called,players:G.players,turn:G.turn,ev:G.ev,game:G.game
  };
}
var sending=false,dirty=false;
function push(){
  dirty=true;
  if(!sending)flush();
}
function flush(){
  if(!dirty)return;
  dirty=false;
  sending=true;
  var wait=0;
  var step=room?Promise.resolve():createRoom();
  step.then(function(){
    return fetch('/api/state',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+room.token},
      body:JSON.stringify(buildState())
    });
  }).then(function(r){
    if(r.status===404){            // stanza scaduta: ne creo una nuova e rinvio
      room=null;set(K.room,'');
      dirty=true;
      return createRoom().then(function(){toast(t('new_room_made'));});
    }
    if(r.status===429){setStatus(false,t('limit'));wait=5000;dirty=true;return;}
    if(!r.ok)throw new Error('http '+r.status);
    setStatus(true,t('connected'));
  }).catch(function(){
    dirty=true;wait=3000;
    setStatus(false,t('offline'));
  }).then(function(){
    sending=false;
    if(dirty)setTimeout(flush,wait);
  });
}

/* ---------- disegno ---------- */
function drawPreview(){
  var p=cur();
  if(!p)return;
  var W=pv.clientWidth-24-8;
  var H=pv.clientHeight-16-8;
  if(W<50||H<50)return;
  var r=R.renderBoard({board:board,phrase:p.text,revealed:G.revealed,width:W,height:H,cap:56,minCols:6});
  board.classList.toggle('complete',r.complete);
}
function buildKeys(){
  var box=el('keys'),letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  box.innerHTML='';
  for(var n=0;n<letters.length;n++){
    (function(L){
      var b=document.createElement('button');
      b.type='button';
      b.className='key'+('AEIOU'.indexOf(L)>=0?' vowel':'');
      b.textContent=L;
      b.setAttribute('data-l',L);
      b.addEventListener('click',function(){guess(L);});
      box.appendChild(b);
    })(letters.charAt(n));
  }
}
function drawKeys(){
  var ks=el('keys').querySelectorAll('.key');
  for(var n=0;n<ks.length;n++){
    var L=ks[n].getAttribute('data-l');
    var r=calledAs(L);
    ks[n].classList.remove('hit','miss');
    if(r)ks[n].classList.add(r);
    ks[n].disabled=!!r||locked()||!RU.canCall(G,L);
  }
}
function drawMeta(){
  var p=cur();
  el('catTxt').textContent=p&&p.cat?p.cat:'';
  el('counter').textContent=G.phrases.length?((G.idx+1)+' / '+G.phrases.length):'';
}
function drawChips(){
  var box=el('chips');
  box.innerHTML='';
  G.players.forEach(function(name,n){
    var b=document.createElement('button');
    b.type='button';
    b.className='chip'+(n===G.turn?' on':'');
    b.textContent=name;
    if(RU.active(G)){
      var sc=G.game.scores[n],sm=document.createElement('small');
      sm.textContent=sc.r+(sc.t?' ('+sc.t+')':'');
      b.appendChild(sm);
    }
    b.addEventListener('click',function(){if(locked())return;RU.setTurn(G,n);changed();});
    box.appendChild(b);
  });
}
function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove('on');},1800);
}
function setStatus(on,text){
  el('dot').classList.toggle('on',!!on);
  el('status').textContent=text;
}

/* mentre la ruota gira sulla TV il conduttore non puo' chiamare lettere */
var lockUntil=0,lockTimer=null;
function locked(){return Date.now()<lockUntil;}

function drawHint(){
  var on=RU.active(G);
  el('hint').hidden=!on;
  el('gameBtns').hidden=!on;
  if(!on)return;
  var name=G.players[G.turn],gm=G.game,msg;
  if(locked())msg=t('spinning');
  else if(gm.phase==='letter')msg=t('hint_letter',{name:name,val:gm.val});
  else if(gm.phase==='choose')msg=RU.canBuyVowel(G)?t('hint_choose',{name:name,cost:gm.vowel}):t('hint_choose_free',{name:name});
  else msg=t('hint_spin',{name:name});
  el('hint').textContent=msg;
  el('bSpin').disabled=locked()||!RU.canSpin(G);
  el('bSolved').disabled=locked()||!RU.canSolve(G);
  el('bWrong').disabled=locked()||!RU.canSolve(G);
}
function redraw(){
  drawPreview();
  drawKeys();
  drawMeta();
  drawChips();
  drawHint();
}
function changed(){
  savePartita();
  redraw();
  push();
}

/* ---------- azioni di gioco ---------- */
function guess(L){
  var p=cur();
  if(!p||calledAs(L)||locked()||!RU.canCall(G,L))return;
  var n=0;
  for(var i=0;i<p.text.length;i++){
    var ch=p.text.charAt(i);
    if(R.isLetter(ch)&&R.norm(ch)===L){G.revealed[i]=true;n++;}
  }
  G.called.push({l:L,r:n?'hit':'miss'});
  RU.call(G,L,n);
  changed();
  if(n&&G.ev.pts)toast(t('pts_line',{n:n,l:L,pts:G.ev.pts}));
  else toast(n?t('letter_count',{n:n,l:L}):t('no_letter',{l:L}));
}
function revealLetters(){
  var p=cur();
  if(!p)return;
  for(var i=0;i<p.text.length;i++){
    var ch=p.text.charAt(i);
    if(R.isLetter(ch)){
      G.revealed[i]=true;
      var L=R.norm(ch);
      if(!calledAs(L))G.called.push({l:L,r:'hit'});
    }
  }
}
function revealAll(){
  revealLetters();
  G.ev={seq:G.ev.seq+1,t:'reveal'};
  changed();
}
function doSolved(){
  if(locked()||!RU.canSolve(G))return;
  revealLetters();
  RU.solved(G);
  changed();
}
function doWrong(){
  if(locked()||!RU.canSolve(G))return;
  RU.wrong(G);
  changed();
}
function doSpin(){
  if(locked()||!RU.canSpin(G))return;
  RU.spin(G,Math.random);
  lockUntil=Date.now()+SPIN_MS;
  changed();
  clearTimeout(lockTimer);
  lockTimer=setTimeout(function(){
    lockUntil=0;
    redraw();
    var e=G.ev;
    if(e.t==='spin')toast(t('spun_value',{v:e.v}));
    else if(e.t==='bankrupt')toast(t('wheel_bankrupt'));
    else if(e.t==='pass')toast(t('wheel_pass'));
  },SPIN_MS);
}
function resetPhrase(advance){
  lockUntil=0;
  G.called=[];
  G.revealed={};
  RU.newRound(G,advance===true);
  G.ev={seq:G.ev.seq+1,t:'reset'};
  changed();
}
function goTo(n){
  if(!G.phrases.length)return;
  G.idx=((n%G.phrases.length)+G.phrases.length)%G.phrases.length;
  resetPhrase(true);
}
function randomPhrase(){
  if(G.phrases.length<2)return;
  var n;
  do{n=Math.floor(Math.random()*G.phrases.length);}while(n===G.idx);
  goTo(n);
}
function nextTurn(){
  if(!G.players.length||locked())return;
  RU.setTurn(G,(G.turn+1)%G.players.length);
  changed();
}

/* ---------- eventi ---------- */
el('bPrev').addEventListener('click',function(){goTo(G.idx-1);});
el('bNext').addEventListener('click',function(){goTo(G.idx+1);});
el('bRand').addEventListener('click',randomPhrase);
el('bReveal').addEventListener('click',revealAll);
el('bReset').addEventListener('click',function(){resetPhrase(false);});
el('bSpin').addEventListener('click',doSpin);
el('bSolved').addEventListener('click',doSolved);
el('bWrong').addEventListener('click',doWrong);
el('bTurn').addEventListener('click',nextTurn);

el('bLang').textContent=I.lang==='it'?'EN':'IT';
el('bLang').addEventListener('click',function(){I.setLang(I.lang==='it'?'en':'it');});
el('bHelp').setAttribute('href',I.lang==='it'?'/it/#come-funziona':'/#how');

el('bCopy').addEventListener('click',function(){
  var url=screenUrl();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){toast(t('link_copied'));},function(){window.prompt('',url);});
  }else{window.prompt('',url);}
});

el('bSet').addEventListener('click',function(){
  el('txt').value=get(K.frasi)||t('default_phrases');
  el('ptxt').value=get(K.conc);
  var gs=gameSettings();
  el('gOn').checked=gs.on;
  el('gVowel').value=gs.vowel;
  el('gWheel').value=RU.wheelToText(gs.wheel,I.lang);
  dlg.showModal();
});
el('dCancel').addEventListener('click',function(){dlg.close();});
el('dScores').addEventListener('click',function(){
  if(!window.confirm(t('reset_scores_confirm')))return;
  RU.resetScores(G);
  dlg.close();
  changed();
});
el('dNew').addEventListener('click',function(){
  if(!window.confirm(t('new_room_confirm')))return;
  room=null;set(K.room,'');
  dlg.close();
  createRoom().then(function(){dirty=true;if(!sending)flush();toast(t('new_room_made'));})
    .catch(function(){setStatus(false,t('offline'));});
});
el('dSave').addEventListener('click',function(){
  var list=R.parsePhrases(el('txt').value);
  if(!list.length){window.alert(t('no_valid_phrase'));return;}
  var wheel=RU.parseWheel(el('gWheel').value);
  if(!wheel){window.alert(t('invalid_wheel'));return;}
  var vowel=parseInt(el('gVowel').value,10);
  if(!(vowel>=0&&vowel<=9999))vowel=250;
  set(K.game,JSON.stringify({on:el('gOn').checked,vowel:vowel,wheelText:RU.wheelToText(wheel,I.lang)}));
  set(K.frasi,el('txt').value);
  set(K.conc,el('ptxt').value);
  G.phrases=list;
  G.players=parsePlayers(el('ptxt').value);
  G.idx=0;G.called=[];G.revealed={};G.turn=0;lockUntil=0;
  applyGameSettings(true);
  RU.newRound(G,false);
  G.ev={seq:G.ev.seq+1,t:'reset'};
  dlg.close();
  changed();
});

// tastiera fisica (se usi la pagina da PC)
document.addEventListener('keydown',function(e){
  if(dlg.open||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='ArrowRight'){e.preventDefault();goTo(G.idx+1);return;}
  if(e.key==='ArrowLeft'){e.preventDefault();goTo(G.idx-1);return;}
  if(e.key==='Enter'){e.preventDefault();revealAll();return;}
  if(e.key.length===1){
    var L=R.norm(e.key);
    if(/^[A-Z]$/.test(L)){e.preventDefault();guess(L);}
  }
});

if(typeof ResizeObserver!=='undefined'){
  new ResizeObserver(function(){drawPreview();}).observe(pv);
}else{
  window.addEventListener('resize',drawPreview);
}

/* ---------- avvio ---------- */
setStatus(false,t('connecting'));
G.phrases=R.parsePhrases(get(K.frasi)||t('default_phrases'));
if(!G.phrases.length)G.phrases=R.parsePhrases(t('default_phrases'));
G.players=parsePlayers(get(K.conc));
applyGameSettings(false);
loadPartita();
buildKeys();
drawRoom();
changed();
})();
</script>
